:root{--amber:#ffb454;--ink:#26140a;--ember:#ff7a1a}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#050302}
body{font-family:'Cinzel',Georgia,serif;color:#f3dcc0;background:#050302;overflow-x:hidden}
#scroller{height:1000vh}
#stage{position:fixed;inset:0;overflow:hidden;background:#050302}
.cam{position:absolute;inset:0;perspective:900px}
.world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.wall,.flr,.back{position:absolute;left:0;top:0;backface-visibility:visible}
.fog{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 55% at 50% 46%,rgba(4,2,1,.93) 0,rgba(4,2,1,.7) 16%,rgba(4,2,1,.15) 46%,rgba(4,2,1,0) 68%),radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.7) 100%)}
.endglow{position:absolute;left:50%;top:46%;width:380px;height:300px;margin:-150px 0 0 -190px;background:radial-gradient(closest-side,rgba(255,150,60,.28),transparent);pointer-events:none;animation:flick 3s infinite}
canvas#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.eng{position:absolute;left:0;top:0;font-family:'JetBrains Mono',monospace;font-weight:500;white-space:nowrap;color:rgba(255,190,110,.62);text-shadow:0 0 14px rgba(255,130,40,.55),2px 2px 0 rgba(0,0,0,.85),-1px -1px 0 rgba(255,220,170,.12);letter-spacing:1px}
.rock{position:absolute;left:0;top:0;background:linear-gradient(90deg,#1a110b,#3a2a20 45%,#241812);}
/* torches */
.torch{position:absolute;left:0;top:0;width:44px;height:240px}
.torch .stick{position:absolute;left:16px;top:70px;width:12px;height:170px;border-radius:4px;background:linear-gradient(90deg,#2a170a,#6b4220 50%,#2a170a);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.torch .cup{position:absolute;left:8px;top:58px;width:28px;height:30px;border-radius:2px 2px 12px 12px;background:linear-gradient(#4a2a12,#1f1006);}
.torch .glow{position:absolute;left:-250px;top:-210px;width:544px;height:544px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,150,50,.34),rgba(255,110,20,.12) 55%,transparent);animation:flick 1.7s infinite}
.fl{position:absolute;left:6px;bottom:182px;width:32px;height:84px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;transform-origin:50% 100%;animation:flame .55s infinite alternate ease-in-out}
.fl.a{background:radial-gradient(ellipse at 50% 80%,#fff1b0 0,#ffb23a 40%,#ff5a0f 75%,transparent 100%);filter:blur(1.5px)}
.fl.b{left:2px;width:40px;height:100px;background:radial-gradient(ellipse at 50% 85%,rgba(255,120,20,.7),rgba(255,60,0,.35) 60%,transparent);filter:blur(5px);animation-duration:.7s;animation-delay:-.2s}
.fl.c{left:12px;width:20px;height:56px;background:radial-gradient(ellipse at 50% 85%,#fffbe0,#ffd36a 55%,transparent);filter:blur(1px);animation-duration:.4s}
@keyframes flame{0%{transform:scale(1,1) skewX(-4deg)}50%{transform:scale(.92,1.08) skewX(3deg)}100%{transform:scale(1.06,.94) skewX(-2deg)}}
@keyframes flick{0%,100%{opacity:.9}20%{opacity:1}35%{opacity:.75}60%{opacity:.98}80%{opacity:.82}}
/* boards */
.board{position:absolute;left:0;top:0;color:var(--ink);padding:34px 44px 36px;border-radius:10px;
 background:var(--wood),linear-gradient(135deg,#b88955,#8d643a);background-size:512px 256px,auto;
 border:9px solid #3a2310;box-shadow:inset 0 0 0 2px rgba(255,210,150,.18),inset 0 0 60px rgba(40,18,4,.55),0 30px 60px rgba(0,0,0,.6),0 0 90px rgba(255,130,40,.16);
 will-change:opacity;font-family:'Inter','Segoe UI',system-ui,sans-serif}
.board:before,.board:after{content:"";position:absolute;top:10px;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8c8b0,#4a3a2a 60%,#1a120a);box-shadow:0 2px 3px rgba(0,0,0,.6)}
.board:before{left:12px}.board:after{right:12px}
.board .kick{font-family:'Cinzel',serif;font-size:14px;letter-spacing:4px;font-weight:600;color:#5a2f10;text-transform:uppercase}
.board h2{font-family:'Cinzel',serif;font-weight:700;font-size:42px;line-height:1.1;margin:6px 0 16px;color:#24120a;text-shadow:0 1px 0 rgba(255,225,180,.45),0 -1px 0 rgba(0,0,0,.35)}
.board h3{font-family:'Cinzel',serif;font-weight:700;font-size:20px;color:#24120a;text-shadow:0 1px 0 rgba(255,225,180,.4)}
.board p,.board li{font-size:17.5px;line-height:1.55;color:#24130a;font-weight:500}
.board ul{list-style:none;display:grid;gap:11px}
.board li:before{content:"◆ ";color:#6b2f0c;font-size:12px}
.row{display:flex;justify-content:space-between;gap:16px;align-items:baseline}
.meta{font-size:14.5px;color:#4a2610;font-weight:600}
.entry{padding:12px 0;border-top:2px dashed rgba(58,35,16,.4)}.entry:first-of-type{border-top:0;padding-top:0}
.rune{display:inline-block;margin:0 8px 9px 0;padding:8px 14px;border-radius:8px;background:linear-gradient(#4a4540,#2b2825);color:#ffd9a0;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -3px 5px rgba(0,0,0,.5),0 3px 5px rgba(0,0,0,.4);text-shadow:0 0 8px rgba(255,150,40,.55)}
.rune.hot{color:#a8ffb0;text-shadow:0 0 10px rgba(110,230,120,.7)}
.grp{font-family:'Cinzel',serif;font-size:13px;letter-spacing:3px;color:#5a2f10;margin:10px 0 7px;font-weight:700}
a.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:9px;background:linear-gradient(#4a2c14,#2a1608);color:#ffd9a0;font-weight:600;font-size:14.5px;text-decoration:none;margin:6px 8px 0 0;box-shadow:inset 0 1px 0 rgba(255,220,170,.25),0 3px 6px rgba(0,0,0,.45);border:1px solid #1a0e05}
a.btn:hover,a.btn:focus-visible{color:#fff;background:linear-gradient(#6b3d1a,#3a1f0c);outline:2px solid #ffb454;outline-offset:2px}
.tablet{margin-top:18px;padding:18px 22px;border-radius:12px;background:linear-gradient(145deg,#4c4741,#2a2724);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -8px 18px rgba(0,0,0,.55),0 8px 18px rgba(0,0,0,.45);font-family:'JetBrains Mono',monospace;font-size:15px;line-height:1.7;white-space:pre;color:#ffc069;text-shadow:0 0 10px rgba(255,140,30,.55),1px 1px 0 rgba(0,0,0,.8)}
.tablet .k{color:#ff8a4a}.tablet .s{color:#ffe29a}.tablet .a{color:#a8ffb0}
.hero h1{font-size:68px;letter-spacing:1px;margin:8px 0 6px}
.hero .sub{font-size:20px;font-weight:600;color:#3a1c0a}
.proj{padding:12px 0;border-top:2px dashed rgba(58,35,16,.4)}.proj:first-of-type{border-top:0;padding-top:0}
.proj p{font-size:15.5px;margin:3px 0 2px}
/* HUD */
.hud{position:fixed;z-index:20;pointer-events:none}
.brand{left:22px;top:18px;display:flex;gap:12px;align-items:center;font-weight:700;letter-spacing:3px;color:#ffd9a0;text-shadow:0 2px 8px #000}
.brand i{width:12px;height:12px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:radial-gradient(#fff2b0,#ff8a1a);box-shadow:0 0 14px #ff7a1a;animation:flick 1.2s infinite}
#snd{right:20px;top:14px;pointer-events:auto;padding:10px 16px;border-radius:10px;border:1px solid #1a0e05;cursor:pointer;background:linear-gradient(#5a3519,#2e1a0a);color:#ffd9a0;font:600 13px 'Cinzel',serif;letter-spacing:2px;box-shadow:inset 0 1px 0 rgba(255,220,170,.3),0 4px 10px rgba(0,0,0,.5)}
#snd:focus-visible{outline:2px solid #ffb454;outline-offset:2px}
#nav{left:18px;top:50%;transform:translateY(-50%);display:grid;gap:14px;pointer-events:auto}
#nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;color:#bfa27d;font:600 12px 'Cinzel',serif;letter-spacing:2px}
#nav button b{width:12px;height:12px;border-radius:50%;background:#2a1a0e;border:2px solid #7a5a3a;transition:.3s}
#nav button span{opacity:0;transform:translateX(-6px);transition:.25s;text-shadow:0 2px 6px #000;white-space:nowrap}
#nav button:hover span,#nav button:focus-visible span,#nav button.on span{opacity:1;transform:none}
#nav button.on b{background:radial-gradient(#fff2b0,#ff8a1a);border-color:#ffb454;box-shadow:0 0 12px #ff8a1a}
#nav button:focus-visible{outline:2px solid #ffb454;outline-offset:4px;border-radius:6px}
#depth{left:50%;bottom:18px;transform:translateX(-50%);text-align:center;font:600 12px 'Cinzel',serif;letter-spacing:3px;color:#d7b98f;text-shadow:0 2px 8px #000}
#depth .bar{width:220px;height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin:8px auto 0;overflow:hidden}
#depth .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7a1a,#ffd36a)}
.leaves{position:absolute;inset:0;pointer-events:none;z-index:5}
.note{position:fixed;z-index:21;right:20px;bottom:16px;max-width:300px;line-height:1.4;font:500 12.5px 'Inter',system-ui,sans-serif;color:#cdb08a;background:rgba(10,6,3,.7);padding:6px 12px;border-radius:12px;border:1px solid rgba(255,200,140,.2)}
@media (max-width:900px){.note{display:none}.brand{font-size:11px;letter-spacing:1px;max-width:48vw;white-space:nowrap;overflow:hidden}#snd{padding:8px 11px;font-size:11px;letter-spacing:1px}.board{padding:24px 24px 26px}.board h2{font-size:32px}.hero h1{font-size:46px}#nav span{display:none}.board p,.board li{font-size:16px}.tablet{font-size:12px}}
@media (prefers-reduced-motion:reduce){.fl,.glow,.endglow,.brand i{animation:none}}
</style></head><body>

const loop=(fn,min,max)=>{const run=()=>{if(!on)return;fn();timers.push(setTimeout(run,min+Math.random()*(max-min)))};timers.push(setTimeout(run,min))};
function startAudio(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0;master.connect(AC.destination);rumble=loopNoise(true,'lowpass',380,.7,.5);rustle=loopNoise(false,'bandpass',2600,.5,.01)}
 AC.resume();on=true;master.gain.cancelScheduledValues(AC.currentTime);master.gain.linearRampToValueAtTime(.9,AC.currentTime+1.2);
 loop(chirp,1500,5200);loop(cricket,1800,4200);
 loop(()=>{const c=.03+.07*P;for(let i=0;i<1+Math.random()*3;i++)burst('bandpass',900+Math.random()*2600,3,.05+Math.random()*.06,c,i*.05)},120,520);
 loop(()=>{if(P<.12)return;const c=.04*Math.min(1,P*2);burst('bandpass',1300,2,.1,c);burst('bandpass',1600,2,.1,c,.12);burst('bandpass',1450,2,.1,c,.24)},2500,6500);
 setInterval(()=>{if(on){rustle.gain.value=.012*Math.max(0,1-P*1.5)+.004;rumble.gain.value=.35+.5*P}},300)}
function stopAudio(){on=false;timers.forEach(clearTimeout);timers=[];if(AC){master.gain.cancelScheduledValues(AC.currentTime);master.gain.linearRampToValueAtTime(0,AC.currentTime+.4)}}
snd.onclick=()=>{if(on){stopAudio()}else startAudio();snd.textContent=on?'♪ SOUND ON':'♪ SOUND OFF';snd.setAttribute('aria-pressed',on)};
requestAnimationFrame(frame);
</script></body></html>
